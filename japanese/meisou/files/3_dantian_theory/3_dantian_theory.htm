<p class="tx-01s" align="center"><b><font size="4">精充気壮神明の原理</font></b></p>
<p class="tx-01t" align="center"><font size="2">
精が充満すれば、気が壮んになり、神（人の霊性）が澄んで清くなるという意味。</font></p>
<div align="center">
  <center>
  <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse" bordercolor="#111111" width="100%" id="AutoNumber1">
    <tr>
      <td width="50%">
      <p align="center"><font size="2"><img src="dahn-no-ss.jpg" width="270" height="177"></font></td>
      <td width="50%"><span class="link"><font size="2">精充は、</font><blockquote>
        <p><font size="2">
        下丹田の開発が完成され、肉体的な健康の問題が解決される状態。俗に精力といわれ、すべての活動の基盤になるエネルギーができる。</font></p>
      </blockquote>
      </span>
      <p><font size="2">気壮は、</font></p>
      <blockquote>
        <p><font size="2">中丹田の開発が完成され、心が開いていく状態。気が壮んになると、気が成熟した成人になることができる。</font></p>
      </blockquote>
      <p><font size="2">神明は、</font></p>
      <blockquote>
        <p><font size="2">上丹田の開発が完成され、智恵が湧き、真理を悟ることができる状態。</font></p>
      </blockquote>
      </td>
    </tr>
  </table>
  </center>
