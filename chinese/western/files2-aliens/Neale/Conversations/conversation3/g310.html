<body lang=ZH-CN style='tab-interval:21.0pt;text-justify-trim:punctuation'>

<h1><span lang="EN-US">10</span><span lang="ZH-CN" style="font-family: 宋体">、我爱你</span></h1>
<p class="MsoNormal"><span lang="EN-US">&nbsp;</span></p>
<p class="MsoBodyTextIndent" style="text-indent:24.0pt">
<span lang="ZH-CN" style="font-size:12.0pt;font-family:宋体;font-weight:normal">
我爱你，你知道吗？</span></p>
<p class="MsoBodyTextIndent" style="text-indent:24.0pt">
<span lang="EN-US" style="font-size:12.0pt;font-family:宋体;font-weight:normal">&nbsp;</span></p>
<p class="MsoBodyTextIndent" style="text-indent:24.0pt">
<span lang="ZH-CN" style="font-size: 12.0pt; font-family: 黑体; font-weight: normal">
知道。我也爱你。你知道吗？</span></p>
<p class="MsoBodyTextIndent" style="text-indent:24.0pt">
<span lang="EN-US" style="font-size: 12.0pt; font-family: 黑体; font-weight: normal">
&nbsp;</span></p>
<p class="MsoBodyTextIndent" style="text-indent:24.0pt">
<span lang="ZH-CN" style="font-size:12.0pt;font-family:宋体;font-weight:normal">
我开始知道。我真的开始知道了</span></p>
<p class="MsoBodyTextIndent" style="text-indent:24.0pt">
<span lang="EN-US" style="font-size:12.0pt;font-family:宋体;font-weight:normal">&nbsp;</span></p>
<p class="MsoBodyTextIndent" style="text-indent:24.0pt">
<span lang="ZH-CN" style="font-size: 12.0pt; font-family: 黑体; font-weight: normal">
真好。</span></p>
