<center>
<h1>第一零七章　什物</h1>
<h2>這章共計七節，前三節是麥加的，後四節是麥地那的。</h2>
<h3>奉至仁至慈的真主之名</h3>
<table cellpadding=5 cellspacing=0 border=0 width='80%'>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>一</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>你曾見否認報應日的人嗎？</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>二</td>
    <td width='90%' valign='top' bgcolor='white'>他就是那個呵斥孤兒，</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>三</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>且不勉勵人賑濟貧民的人。</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>四</td>
    <td width='90%' valign='top' bgcolor='white'>傷哉！禮拜的人們，</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>五</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>他們是忽視拜功的，</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>六</td>
    <td width='90%' valign='top' bgcolor='white'>他們是沽名釣譽的，</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>七</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>他們是不肯借人什物的。</td>
  </tr>
</table>
<br>
