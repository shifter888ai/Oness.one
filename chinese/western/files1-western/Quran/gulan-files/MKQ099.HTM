<center>
<h1>第九九章　地震</h1>
<h2>這章是麥地那的，全章共計八節。</h2>
<h3>奉至仁至慈的真主之名</h3>
<table cellpadding=5 cellspacing=0 border=0 width='80%'>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>一</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>當大地猛烈地震動，</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>二</td>
    <td width='90%' valign='top' bgcolor='white'>拋其重擔，</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>三</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>人們說：「大地怎麼啦？」</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>四</td>
    <td width='90%' valign='top' bgcolor='white'>在那日，大地將報告它的消息。</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>五</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>因為你的主已啟示了它；</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>六</td>
    <td width='90%' valign='top' bgcolor='white'>在那日，人們將紛紛地離散，以便他們得見自己行為的報應。</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>七</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>行一個原子重的善事者，將見其善報；</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>八</td>
    <td width='90%' valign='top' bgcolor='white'>作一個原子重的惡事者，將見其惡報。</td>
  </tr>
</table>
<br>
</center>
