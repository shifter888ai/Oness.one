<center>
<h1>第九三章　上午</h1>
<h2>這章是麥加的，全章共計一一節。</h2>
<h3>奉至仁至慈的真主之名</h3>
<table cellpadding=5 cellspacing=0 border=0 width='80%'>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>一</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>誓以上午，</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>二</td>
    <td width='90%' valign='top' bgcolor='white'>誓以黑夜，當其寂靜的時候，</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>三</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>你的主沒有棄絕你，也沒有怨恨你；</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>四</td>
    <td width='90%' valign='top' bgcolor='white'>後世於你，確比今世更好；</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>五</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>你的主將來必賞賜你，以至你喜悅。</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>六</td>
    <td width='90%' valign='top' bgcolor='white'>難道他沒有發現你伶仃孤苦，而使你有所歸宿？</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>七</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>他曾發現你徘徊歧途，而把你引入正路；</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>八</td>
    <td width='90%' valign='top' bgcolor='white'>發現你家境寒苦，而使你衣食豐足。</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>九</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>至於孤兒，你不要壓迫他；</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='white'>一零</td>
    <td width='90%' valign='top' bgcolor='white'>至於乞丐，你不要喝斥他，</td>
  </tr>
  <tr>
    <td width='10%' align='right' valign='top' bgcolor='#eeeeee'>一一</td>
    <td width='90%' valign='top' bgcolor='#eeeeee'>至於你的主所賜你的恩典呢，你應當宣示它。</td>
  </tr>
</table>
<br>
</center>
