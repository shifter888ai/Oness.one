<p><font face="微软雅黑"><b><font size="5">《小河水奥义书》</font></b><br>
<br>
1。最精微的运动是心的运动，此运动进入意识，由意识逐层上升，此运动的结果是众生的各种念想。<br>
<br>
2。意识的本质是精气，精气来自于食物。<br>
<br>
3。长期地注意力集中可引起意识的转变，意识的差别导致智慧的不同。<br>
<br>
4。人的意识可体验的世界依次是：人间，魂魄界，天界。<br>
<br>
5。在天界的顶端意识达到最大，出离天界的行者告别意识，成为的纯粹心。<br>
<br>
6。我执的消除依赖意识，此消除的过程是：我是肉体，我是气体，我是心。<br>
<br>
7。苦行的目的是保留意识的同时，消灭心。</font></p>
