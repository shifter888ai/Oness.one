<TR><TD VALIGN=TOP><A NAME=1>10:1</A><TD>亚 哈 随 鲁 王 使 旱 地 ， 和 海 岛 的 人 民 都 进 贡 。
</td></tr>
<TR><TD VALIGN=TOP><A NAME=2>10:2</A><TD>他 以 权 柄 能 力 所 行 的 ， 并 他 抬 举 末 底 改 使 他 高 升 的 事 ， 岂 不 都 写 在 玛 代 ， 和 波 斯 王 的 历 史 上 麽 。
</td></tr>
<TR><TD VALIGN=TOP><A NAME=3>10:3</A><TD>犹 大 人 末 底 改 作 亚 哈 随 鲁 王 的 宰 相 ， 在 犹 大 人 中 为 大 ， 得 他 众 弟 兄 的 喜 悦 ， 为 本 族 的 人 求 好 处 ， 向 他 们 说 和 平 的 话 。
</td></tr>
