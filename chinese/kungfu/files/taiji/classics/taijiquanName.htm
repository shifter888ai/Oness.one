<body bgColor="#E8E3E7" leftMargin="1" topMargin="6">

<p style="line-height: 150%; word-spacing: 0; margin: 0" align="center">
<font face="微软雅黑">
<font size="5">太极拳释名</font></font></p>
<p style="line-height: 150%; word-spacing: 0; margin: 0" align="center">
<br>
<font size="3" face="微软雅黑">王宗岳<br>
<br>
一名长拳 一名十三势</font></p>
<p style="line-height: 150%; word-spacing: 0; margin: 0" align="center">
<font size="3" face="微软雅黑">长拳者 如长江大海 滔滔不绝也。</font></p>
<p style="line-height: 150%; word-spacing: 0; margin: 0" align="center">
<font size="3" face="微软雅黑">十三势者 掤、捋、挤、按　采、挒、肘、靠。进、退、顾、盼、定也。</font></p>
<p style="line-height: 150%; word-spacing: 0; margin: 0" align="center">
<font size="3" face="微软雅黑">掤、捋、挤、按 即坎、离　震、兑 四正方也</font></p>
<p style="line-height: 150%; word-spacing: 0; margin: 0" align="center">
<font size="3" face="微软雅黑">采、挒、肘、靠 即乾、坤、良、巽 四斜角也。此八卦也。</font></p>
<p style="line-height: 150%; word-spacing: 0; margin: 0" align="center">
<font size="3" face="微软雅黑">进步、退步　左顾、右盼、中定 即金、木、水、火、土也。此五行也。</font></p>
<p style="line-height: 150%; word-spacing: 0; margin: 0" align="center">
<font size="3" face="微软雅黑">合而言之 曰十三势。</font></p>
<p align="center">　</p>
