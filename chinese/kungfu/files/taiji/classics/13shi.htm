<p style="line-height: 150%" align="center"><font face="微软雅黑"><font size="5">十三势歌</font><br>
<br>
<font size="3">十三总势莫轻视。命意源头在腰际。变换虚实需留意。气遍身躯不少滞。<br>
静中触动动尤静。因敌变化示神奇。势势存心揆用意。得来不觉费功夫。<br>
刻刻留心在腰间。腹内松净气腾然。尾闾中正神贯顶。满身轻利顶头悬。<br>
仔细留心向推求。屈伸开合听自由。入门引路需口授。功夫无息法自修。<br>
若言体用何为准。意气君来骨肉臣。想推用意终何在。益寿延年不老春。<br>
歌兮歌兮百四十。字字真切义无遗。若不向此推求去。枉费工夫贻叹息。</font></font></p>
