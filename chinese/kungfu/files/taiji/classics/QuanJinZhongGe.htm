<p align="center"><font face="微软雅黑"><font size="5">拳经总歌</font><br>
<br>
明末清初时人</font></p>
<p align="center"><font face="微软雅黑">纵放屈伸人莫知，诸靠缠绕我皆依。劈打推压得进步，搬搁横采也难敌。<br>
钩掤逼沉人人晓，闪惊取巧有谁知，佯输诈走谁云败，引诱回冲致胜归。<br>
滚拴搭扫灵微妙，横直劈砍奇更奇，截进遮拦穿心肘，迎风接步红炮捶。<br>
二换扫压挂面脚，左右边簪庄跟腿，截前压後无缝锁，声东击西要熟识。<br>
上笼下提君须记，进攻退闪莫迟迟，藏头盖面天下有，惯心剁胁世间稀。<br>
教师不识此中理，难将武艺论高低。</font></p>
<p align="left"><font face="微软雅黑">
【注：此歌见於陈氏两仪堂本拳谱，歌词显受戚继光(拳经)影响，为总括太极拳五路、长拳一百八势一路及炮捶一路之理法，唐豪考定为陈王廷原著。】<br>
<br>
　</font></p>
