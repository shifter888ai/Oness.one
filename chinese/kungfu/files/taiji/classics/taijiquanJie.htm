<font color="#000000" size="5">太极拳解</font></font></p>
<p style="line-height: 150%; word-spacing: 0; margin: 0" align="center">
<br>
<font size="3" face="微软雅黑">武禹襄</font></p>
<p style="line-height: 150%; word-spacing: 3; margin-left: 8; margin-right: 2; margin-top: 8; margin-bottom: 1" align="left">
<font size="3" face="微软雅黑"><br>
身虽动，心贵静；气须敛，神宜舒。心为令，气为旗；神为主帅，身为驱使。刻刻留意，方有所得。先在心，后在身。在身，则不知手之舞之，足虽蹈之，所谓“一气呵成”、“舍己从人”、“引进落空”、“四两拨千斤”也须知：一动无有不动，一静无有不静。视动犹静，视静犹动。内固精神，外显安逸。须要从人，不要从己。从人则活，从己则滞。尚气者无力，养气者纯刚彼不动，己不动；彼微动，己以动。以己从人，务要知己，乃能随转随接；以己粘人，必须知人，乃能不后不先精神能提得起，则无滞重之虞；粘依能跟得灵，方见落空之妙。往复须分阴阳，进退须有转合。机由己发，力从人借。</font></p>
