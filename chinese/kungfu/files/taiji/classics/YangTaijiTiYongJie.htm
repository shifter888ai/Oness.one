<p align="center" style="line-height: 150%"><b><font size="5" face="微软雅黑">清代杨氏传钞老谱太极体用解</font></b></p>
<p align="justify" style="line-height: 150%"><font size="3" face="微软雅黑"><br>
理为精、气、神之体。精、气、神为身之体。身为心之用，劲力为身之用。心、身有一定之主宰者理也。精、气、神有一定之主宰者，意诚也。诚者，天道；诚之者，人道。俱不外意念须臾之间。<br>
<br>
要知天人同体之理，自得日月流行之气。其气意之流行，精神自隐微乎理矣！夫而后言乃武、乃文、乃圣、乃神，则得矣。若特以武事论之于心身，用之于劲力，仍归于道之本也，故不得独以末技云尔！<br>
<br>
劲由于筋，力由于骨，如以持物论之，有力能执数百斤，是肯节、皮毛之外操也，故有硬力。如以全体之有劲，似不能持几斤，是精气之内壮也。虽然，若是功成后犹有妙出于硬力者，修身、体育之道有然也。</font></p>
