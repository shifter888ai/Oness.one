<font color="#ff0000">第三十五卦 晋 火地晋 离上坤下</font>&nbsp;</font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
晋：康侯用锡马蕃庶，昼日三接。<br>
<br>
彖曰：晋，进也。明出地上，顺而丽乎大明，柔进而上行。是以康侯用锡马蕃庶，昼日 三接也。<br>
<br>
象曰：明出地上，晋；君子以自昭明德。<br>
<br>
初六：晋如，摧如，贞吉。罔孚，裕无咎。象 曰：晋如，摧如；独行正也。裕无咎；未受命也。<br>
<br>
六二：晋如，愁如，贞吉。受兹介福，于其王母。象曰：受之介福，以中正也。<br>
<br>
六三：众允，悔亡。象曰：众允之，志上行也。<br>
<br>
九四：晋如硕鼠，贞厉。象曰：硕鼠贞厉，位不当也。<br>
<br>
六五：悔亡，失得勿恤，往吉无不利。象曰：失得勿恤，往有庆也。<br>
<br>
上九：晋其角，维用伐邑，厉吉无咎，贞吝。象曰：维用伐邑，道未光也。</font></p>
