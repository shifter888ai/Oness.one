<font color="#ff0000">第五十八卦 兑 兑为泽 兑上兑下&nbsp;</font></font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
兑：亨，利贞。<br>
<br>
彖曰：兑，说也。刚中而柔外，说以利贞，是以顺乎天，而应乎人。说以先民，民忘其 劳；说以犯难，民忘其死；说之大，民劝矣哉！<br>
<br>
象曰：丽泽，兑；君子以朋友讲习。<br>
<br>
初九：和兑，吉。象曰：和兑之吉，行未疑也。<br>
<br>
九二：孚兑，吉，悔亡。象曰：孚兑之吉，信志也。<br>
<br>
六三：来兑，凶。象曰：来兑之凶，位不当也。<br>
<br>
九四：商兑，未宁，介疾有喜。象曰：九四之喜，有庆也。<br>
<br>
九五：孚于剥，有厉。象曰：孚于剥，位正当也。<br>
<br>
上六：引兑。象曰：上六引兑，未光也。</font></p>
