<img src="../64fig/60.gif" border="0" width="88" height="162">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 
第六十卦 节 水泽节 坎上兑下&nbsp;</font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
节：亨。苦节不可贞。<br>
<br>
彖曰：节，亨，刚柔分，而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中 正以通。天地节而四时成，节以制度，不伤财，不害民。<br>
<br>
象曰：泽上有水，节；君子以制数度，议德行。<br>
<br>
初九：不出户庭，无咎。象曰：不出户 庭，知通塞也。<br>
<br>
九二：不出门庭，凶。象曰：不出门庭，失时极也。<br>
<br>
六三：不节若，则嗟若，无咎。象曰：不节之嗟，又谁咎也。<br>
<br>
六四：安节，亨。象曰：安节之亨，承上道也。<br>
<br>
九五：甘节，吉；往有尚。象曰：甘节之吉，居位中也。<br>
<br>
上六：苦节，贞凶，悔亡。象曰：苦节贞凶，其道穷也。&nbsp;</font></p>
