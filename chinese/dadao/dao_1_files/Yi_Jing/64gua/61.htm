<img src="../64fig/61.gif" border="0" width="88" height="162">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 
第六十一卦 中孚 风泽中孚 巽上兑下&nbsp;</font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
中孚：豚鱼吉，利涉大川，利贞。<br>
<br>
彖曰：中孚，柔在内而刚得中。说而巽，孚，乃化邦也。豚鱼吉，信及豚鱼也。利涉大 川，乘木舟虚也。中孚以利贞，乃应乎天也。<br>
<br>
象曰：泽上有风，中孚；君子以议狱缓死。<br>
<br>
初九：虞吉，有他不燕。象曰：初九虞吉， 志未变也。<br>
<br>
九二：鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。象曰：其子和之，中心愿也。<br>
<br>
六三：得敌，或鼓或罢，或泣或歌。象曰：可鼓或罢，位不当也。<br>
<br>
六四：月几望，马匹亡，无咎。象曰：马匹亡，绝类上也。<br>
<br>
九五：有孚挛如，无咎。象曰：有孚挛如，位正当也。<br>
<br>
上九：翰音登于天，贞凶。象曰：翰音登于天，何可长也。&nbsp;</font></p>
