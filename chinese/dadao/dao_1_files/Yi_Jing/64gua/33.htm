第三十三卦 遁 天山遁 乾上艮下</font>&nbsp;</font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
遁：亨，小利贞。 彖曰：遁亨，遁而亨也。刚当位而应，与时行也。小利贞，浸而长也。遁之时义大矣 哉！<br>
<br>
象曰：天下有山，遁；君子以远小人，不恶而严。<br>
<br>
初六：遁尾，厉，勿用有攸往。象曰：遁尾之厉，不往何灾也。<br>
<br>
六二：执之用黄牛之革，莫之胜说。象曰：执用黄牛，固志也。<br>
<br>
九三：系遁，有疾厉，畜臣妾吉。象曰：系遁之厉，有疾惫也。畜臣妾吉，不可大事 也。<br>
<br>
九四：好□君子吉，小人否。象曰：君子好遁，小人否也。<br>
<br>
九五：嘉遁，贞吉。象曰：嘉遁贞吉，以正志也。<br>
<br>
上九：肥遁，无不利。象曰：肥遁，无不利；无所疑也。</font></p>
