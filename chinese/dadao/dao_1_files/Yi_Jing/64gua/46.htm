<img src="../64fig/10.gif" border="0" width="88" height="162">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
<font color="#ff0000">第四十六卦 升 地风升 坤上巽下</font>&nbsp;</font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
升：元亨，用见大人，勿恤，南征吉。<br>
<br>
彖曰：柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤；有庆也。南征吉， 志行也。<br>
<br>
象曰：地中生木，升；君子以顺德，积小以高大。<br>
<br>
初六：允升，大吉。象曰：允升大 吉，上合志也。<br>
<br>
九二：孚乃利用禴，无咎。象曰：九二之孚，有喜也。<br>
<br>
九三：升虚邑。象曰：升虚邑，无所疑也。<br>
<br>
六四：王用亨于岐山，吉无咎。象曰：王用亨于岐山，顺事也。<br>
<br>
六五：贞吉，升阶。象曰：贞吉升阶，大得志也。<br>
<br>
上六：冥升，利于不息之贞。象曰：冥升在上，消不富也。</font></p>
