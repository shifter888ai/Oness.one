<font color="#ff0000">第五十七卦 巽 巽为风 巽上巽下&nbsp;</font></font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
巽：小亨，利攸往，利见大人。<br>
<br>
彖曰：重巽以申命，刚巽乎中正而志行。柔皆顺乎刚，是以小亨，利有攸往，利见大 人。<br>
<br>
象曰：随风，巽；君子以申命行事。<br>
<br>
初六：进退，利武人之贞。象曰：进退，志疑也。 利武人之贞，志治也。<br>
<br>
九二：巽在床下。用史巫纷若，吉无咎。象曰：纷若之吉，得中也。<br>
<br>
九三：频巽，吝。象曰：频巽之吝，志穷也。<br>
<br>
六四：悔亡，田获三品。象曰：田获三品，有功也。<br>
<br>
九五：贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。象曰：九五之吉，位 正中也。<br>
<br>
上九：巽在床下，丧其资斧，贞凶。象曰：巽在□下，上穷也。丧其资斧，正乎凶也。</font></p>
