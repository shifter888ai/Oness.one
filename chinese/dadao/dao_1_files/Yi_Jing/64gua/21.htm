<font color="#ff0000">&nbsp;<span lang="ja">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
</span>第二十一卦 噬嗑&nbsp; 火雷噬嗑 离上震下</font></p>
<p>&nbsp;&nbsp;&nbsp; 噬嗑：亨。利用狱。</p>
<p>&nbsp;&nbsp;&nbsp; 彖曰：颐中有物，曰噬嗑，噬嗑而亨。刚柔分，动而明，雷电合而章。柔得中而上行， 虽不当位，利用狱也。</p>
<p>&nbsp;&nbsp;&nbsp; 象曰：雷电噬嗑；先王以明罚敕法。</p>
<p>&nbsp;&nbsp;&nbsp; 初九：履校灭趾，无咎。象曰：履校灭趾，不行 也。</p>
<p>&nbsp;&nbsp;&nbsp; 六二：噬肤灭鼻，无咎。象曰：噬肤灭鼻，乘刚也。</p>
<p>&nbsp;&nbsp;&nbsp; 六三：噬腊肉，遇毒；小吝，无咎。象曰：遇毒，位不当也。</p>
<p>&nbsp;&nbsp;&nbsp; 九四：噬乾胏，得金矢，利艰贞，吉。象曰：利艰贞吉，未光也。 
六五：噬乾肉，得黄金，贞厉，无咎。象曰：贞厉无咎，得当也。</p>
<p>&nbsp;&nbsp;&nbsp; 上九：何校灭耳，凶。象曰：何校灭耳，聪不明也。</p>
