<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun">
<img src="../64fig/17.gif" border="0" width="88" height="163">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
<font color="#ff0000">第十七卦 随 泽雷随 兑上震下&nbsp;</font></font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
随：元亨利贞，无咎。</font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun">
彖曰：随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时，随之时义大矣哉！</font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun">
象曰：泽中有雷，随；君子以&#57885;晦入宴息。<br>
<br>
初九：官有渝，贞吉。出门交有功。象曰： 官有渝，从正吉也。出门交有功，不失也。&nbsp;<br>
<br>
六二：系小子，失丈夫。象曰：系小子，弗兼与也。<br>
<br>
六三：系丈夫，失小子。随有求得，利居贞。象曰：系丈夫，志舍下也。<br>
<br>
九四：随有获，贞凶。有孚在道，以明，何咎。象曰：随有获，其义凶也。有孚在道， 明功也。<br>
<br>
九五：孚于嘉，吉。象曰：孚于嘉，吉；位正中也。<br>
<br>
上六：拘系之，乃从维之。王用亨于西山。象曰：拘系之，上穷也。</font></p>
<p style="LINE-HEIGHT: 150%" align="left">　</p>
