<font color="#ff0000">第五十二卦 艮 艮为山 艮上艮下&nbsp;</font></font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
艮：艮其背，不获其身，行其庭，不见其人，无咎。<br>
<br>
彖曰：艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所 也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。<br>
<br>
象曰：兼山，艮；君子以思不出其位。<br>
<br>
初六：艮其趾，无咎，利永贞。象曰：艮其趾， 未失正也。<br>
<br>
六二：艮其腓，不拯其随，其心不快。象曰：不拯其随，未退听也。<br>
<br>
九三：艮其限，列其夤，厉薰心。象曰：艮其限，危薰心也。<br>
<br>
六四：艮其身，无咎。象曰：艮其身，止诸躬也。<br>
<br>
六五：艮其辅，言有序，悔亡。象曰：艮其辅，以中正也。<br>
<br>
上九：敦艮，吉。象曰：敦艮之吉，以厚终也。</font></p>
