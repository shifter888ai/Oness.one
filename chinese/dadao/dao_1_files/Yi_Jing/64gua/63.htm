<font color="#ff0000"><img src="../64fig/63.gif" border="0" width="88" height="162">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 
第六十三卦 既济 水火既济 坎上离下</font>&nbsp;</font></p>
<p style="LINE-HEIGHT: 150%" align="left"><font face="SimSun"><br>
<br>
既济：亨，小利贞，初吉终乱。<br>
<br>
彖曰：既济，亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其 道穷也。<br>
<br>
象曰：水在火上，既济；君子以思患而预防之。<br>
<br>
初九：曳其轮，濡其尾，无咎。象曰： 曳其轮，义无咎也。<br>
<br>
六二：妇丧其茀，勿逐，七日得。象曰：七日得，以中道也。<br>
<br>
九三：高宗伐鬼方，三年克之，小人勿用。象曰：三年克之，惫也。<br>
<br>
六四：（纟需）有衣袽，终日戒。象曰：终日戒，有所疑也。<br>
<br>
九五：东邻杀牛，不如西邻之禴祭，实受其福。象曰：东邻杀牛，不如西邻之时也； 实受其福，吉大来也。<br>
<br>
上六：濡其首，厉。象曰：濡其首厉，何可久也。</font></p>
