<p><strong><font color="#003399">一、眼瞼寬廣而美的人</font></strong><br>
　　<font color="#339900">１．個性良好溫和。<br>
　　２．居住的環境極佳。<br>
　　３．能得長輩照顧提攜，獲得遺產。</font></p>
<p><strong><font color="#0033cc">二、上眼瞼狹窄而陷的人</font></strong><br>
　<font color="#339900">　１．個性較急。<br>
　　２．居住環境較差。<br>
　　３．做房產買賣極易吃虧，不易賺錢。</font></p>
<p><strong><font color="#003399">三、眼瞼有痣或疤的人</font></strong><br>
　　<font color="#339900">１．容易變動環境。<br>
　　２．家內易不平安。</font></p>
<p><strong><font color="#0033cc">四、眼瞼表筋顯現的人</font></strong><br>
　　<font color="#339900">１．要檢查內分泌系統。<br>
　　２．否則會影嚮睡眠不足或失眠。</font></p>
<p><font color="#339900">　</font></p>
