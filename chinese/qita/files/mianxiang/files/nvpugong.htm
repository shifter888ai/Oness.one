<p><strong><font color="#003399">一、兩腮尖削無肉的人</font></strong><br>
　　<font color="#339900">１．遇不到知心與忠心的朋友，無法相信他人疑神疑鬼。<br>
　　２．晚運不佳。</font></p>
<p><strong><font color="#003399">二、破陷、傷疤、痣痕的人</font><br>
</strong>　　<font color="#339900">１．易遭下屬的攻訐或誣告，雖有忠實的部下。<br>
　　２．宜防水厄。</font></p>
<p><strong><font color="#003399">三、腮骨成　角方形的人</font><br>
</strong>　　<font color="#339900">１．精神活力充足，肯苦幹。<br>
　　２．老運極佳的人。</font></p>
<p><strong><font color="#003399">四、腮頰肌肉圓豐的人</font><br>
</strong>　　<font color="#339900">１．性格圓滿，個性溫和。<br>
　　２．為人忠厚誠實，以善待人。</font></p>
<p>　</p>
<p><strong><font color="#cc6633">備註：<br>
</font></strong><font color="#cc6633">１．承漿有痣忌行船並戒酒，會有水厄。<br>
２．承漿為奴僕宮氣色灰暗家中潮濕，反之則乾陽光充足。</font></p>
