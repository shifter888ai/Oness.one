<p><strong><font color="#003399">一、福德宮尖削無肉的人</font></strong><br>
　　<font color="#339900">１．很勞碌，但總是勞多獲少。<br>
　　２．個性孤獨，不易獲得知音。</font></p>
<p><strong><font color="#003399">二、低陷或有缺陷的人</font></strong><br>
　　<font color="#339900">１．可以說是一個無福的人，勞碌命不妨外出創業，也許會有一番新氣象。<br>
　　２．小心農曆四月份及七月份有災禍。</font></p>
<p><strong><font color="#003399">三、飽滿明潔的人</font></strong><br>
　　<font color="#339900">１．福氣很大，福澤不小。<br>
　　２．可以安心享樂，事業成功的人，一生很少挫折。</font></p>
