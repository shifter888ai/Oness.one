<CENTER><B><FONT FACE="楷体_GB2312"><FONT COLOR="#FF6666"><FONT SIZE=5>小官人</FONT></FONT></font></B></CENTER>
<center><HR WIDTH="85%"></CENTER>
<div align="center">
<table border="0">
  <tr>
    <td><pre><span class="content">    太史某翁，忘其姓氏，昼卧斋中，忽有小卤簿，出自堂陬。马大如蛙，人细如指。小仪
仗以数十队。一官冠皂纱，着绣襆，乘肩舆，纷纷出门而去。公心异之，窃疑睡眼之讹。顿
见一小人返入舍，携一毡包大如拳，竟造床下。白言：“家主人有不腆之仪，敬献太史。”
言已，对立，即又不陈其物。少间又自笑曰：“戋戋微物，想太史亦无所用，不如即赐小
人。”太史颔之。欣然携之而去。后不复见。惜太史中馁，不曾诘所来。
