<CENTER><B><FONT FACE="楷体_GB2312"><FONT COLOR="#FF6666"><FONT SIZE=5>杜小雷</FONT></FONT></font></B></CENTER>
<center><HR WIDTH="85%"></CENTER>
<div align="center">
<table border="0">
  <tr>
    <td><pre><span class="content">    杜小雷，益都之西山人。母双盲。杜事之孝，家虽贫，甘旨无缺。一日将他适，市肉付
妻，令作馎饦。妻最忤逆，切肉时杂蜣螂其中。母觉臭恶不可食，藏以待子。杜归，问：
“馎饦美乎？”母摇首，出示子。杜裂视，见蜣螂，怒甚。入室欲挞妻，又恐母闻。上榻筹
思，妻问之，不语。妻自馁，彷徨榻下。久之喘息有声。杜叱曰：“不睡待敲扑耶！”亦觉
寂然。起而烛之，但见一豕，细视，则两足犹人，始知为妻所化。邑令闻之，絷去，使游四
门，以戒众人。谭薇臣曾亲见之。
