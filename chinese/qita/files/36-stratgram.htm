<div class=Section1>

<p class=MsoPlainText style='margin-bottom:12.0pt'><b style='mso-bidi-font-weight:
normal'><span lang=ZH-CN style='font-size:14.0pt;font-family:SimSun;mso-ascii-font-family:
"Courier New";mso-hansi-font-family:"Courier New"'>《三十六计》</span></b><span
lang=EN-US><br>
<br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>一．瞒天过海</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>二．一箭双雕</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>三．借刀杀人</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>四．以逸待劳</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>五．趁火打劫</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>六．声东击西</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>七．无中生有</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>八．暗渡陈仓</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>九．指桑骂槐</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十．借尸还魂</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十一．顺手牵羊</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十二．明知故昧</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十三．调虎离山</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十四．欲擒先纵</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十五．釜底抽薪</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十六．先发制人</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十七．打草惊蛇</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十八．落井下石</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>十九．虚张声势</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>二十．反客为主</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>廿一．金蝉脱壳</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>廿二．移尸嫁祸</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>廿三．杀鸡敬猴</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>廿四．偷龙转凤</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>廿五．擒贼擒王</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>廿六．扮猪吃虎</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>廿七．过桥抽板</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>廿八．李代桃僵</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>廿九．抛砖引玉</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>三十．美人计</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>卅一．激将计</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>卅二．空城计</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>卅三．反间计</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>卅四．苦肉计</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>卅五．连环计</span><span lang=EN-US><br>
</span><span lang=ZH-CN style='font-family:SimSun;mso-ascii-font-family:"Courier New";
mso-hansi-font-family:"Courier New"'>卅六．走</span></p>
