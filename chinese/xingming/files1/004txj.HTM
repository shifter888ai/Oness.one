<font color="#FF3366" size="5">高上玉皇胎息經</font></b></font></p>
<p align="center"><font face="微软雅黑">玉皇天尊曰：<br>
胎從伏炁中結，炁從有胎中息。<br>
炁入身來謂之生，神去離形謂之死。<br>
知神炁，可以長生。<br>
故守虛無，以養神炁。<br>
神行即炁行，神住即炁住。<br>
若欲長生，神炁相注。<br>
心不動念，無來無去，不出不入，自然常在。<br>
勤而行之，是真道路。</font></p>
