<p align="center"><b><font size="4" face="微软雅黑">太上老君說了心經</font></b></p>
<p align="center"><font face="微软雅黑">『正統道藏』洞神部本文類</font></p>
<p align="left"><font face="微软雅黑">老君曰：<br>
若夫修道，先觀其心。心為神主，動靜從心。心動無靜，不動了真。<br>
心為禍本，心為道宗。不動不靜，無想無存。無心無動，有動從心。<br>
了心真性，了性真心。心無所住，住無所心。了無執住，無執轉真。<br>
空無空處，空處了真。<br>
<br>
老君曰：<br>
吾從無量劫來，觀心得道，乃至虛無，有何所得？為諸眾生，強名得道。<br>
<br>
老君曰：<br>
吾觀眾生，不了其心，徒勞浩劫，<br>
虛役其神，於心無了，永劫沈淪。<br>
依吾聖教，逍遙抱真。<br>
&nbsp;</font></p>
