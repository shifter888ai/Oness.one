<p align="center"><font face="微软雅黑">（戰國出土）</font></p>
<p><font face="微软雅黑">行炁，深則蓄，蓄則伸，伸則下，下則定，定則固，固則萌，萌則長，長則退，退則天。天幾舂在上；地幾舂在下。順則生；逆則死。”
