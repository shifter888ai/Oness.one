<p align="center"> <font face="微软雅黑" color="#000000" size="4"><b><font color="#FF3366">吕</font></b></font><font face="微软雅黑">
</font> 
  <font color="#FF3366"><b><font face="微软雅黑" size="4">&nbsp;</font><font face="微软雅黑">
</font> 
  <font face="微软雅黑" size="4">祖</font><font face="微软雅黑"> </font> 
<font face="微软雅黑" size="4">&nbsp;</font><font face="微软雅黑"> </font> 
  <font face="微软雅黑" size="4">百</font><font face="微软雅黑"> </font> 
<font face="微软雅黑" size="4">&nbsp;</font><font face="微软雅黑"> </font> 
  <font face="微软雅黑" size="4">字</font><font face="微软雅黑"> </font> 
<font face="微软雅黑" size="4">&nbsp;</font><font face="微软雅黑"> </font> 
  <font face="微软雅黑" size="4">碑</font></b></font><font face="微软雅黑"> </font> </p>
<p align="center"> <font face="微软雅黑" color="#000000" size="3">养气忘言守，降心为不为。动静知宗祖，无事更寻谁？</font><font face="微软雅黑">
</font> 
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">真常须应物，应物要不迷。不迷性自住，性住气自回。</font><font face="微软雅黑">
</font>
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">气回丹自结，壶中配坎离。阴阳生反复，普化一声雷。</font><font face="微软雅黑">
</font>
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">白云朝顶上，甘露洒须弥。自饮长生酒，逍遥谁得知。</font><font face="微软雅黑">
</font>
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">坐听无弦曲，明通造化机。都来二十句，端的上天梯。</font><font face="微软雅黑">
</font>
</p>
<p align="center">
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">附：吕仙翁百字碑</font><font face="微软雅黑">
</font>
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">本性好清静，保养心猿定。酒不何曾饮，色欲己罢尽。</font><font face="微软雅黑">
</font>
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">财又我不贪，气又我不竞。见者如不见，听者如不听。</font><font face="微软雅黑">
</font>
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">莫管他人非，只寻自己病。官中不系名，私下凭信行。</font><font face="微软雅黑">
</font>
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">遇有不轻狂，如无守本分。不在人壳中，免却心头闷。</font><font face="微软雅黑">
</font>
</p>
<p align="center">
<font face="微软雅黑" color="#000000" size="3">和光且同尘，但把俗情混。因甚不争名，曾共高人论。</font><font face="微软雅黑">
</font>
</p>
