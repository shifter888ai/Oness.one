<body background="../../IMAGES/yxh004.gif">
<p align="center"> <font color="#FF3366" size="4"><b>高 上 玉 皇 心 印 妙 经</b></font></p>
<p align="center"><font face="宋体" color="#000000" size="3">上药三品，神与炁精。恍恍惚惚，杳杳冥冥。存无守有，顷刻而成。</font> 
</p>
<p align="center">
<font face="宋体" color="#000000" size="3">回风混合，百日功灵。默朝上帝，一纪飞升。知者易悟，昧者难行。</font>
</p>
<p align="center">
<font face="宋体" color="#000000" size="3">履践天光，呼吸育清。出玄入牝，若亡若存。绵绵不绝，固蒂深根。</font>
</p>
<p align="center"> <font face="宋体" color="#000000" size="3">人各有精，精合其神。神合其炁，炁合其真。不得其真，皆是强名。</font> 
</p>
<p align="center"> <font face="宋体" color="#000000" size="3">神能入石，神能飞形。入水不溺，入火不焚。神依形生，精依气盈。</font> 
</p>
<p align="center">
<font face="宋体" color="#000000" size="3">不凋不残，松柏青青。三品一理，妙不可听。其聚则有，其散则零。</font>
</p>
<p align="center">
<font face="宋体" color="#000000" size="3">七窍相通，窍窍光明。圣日圣月，照耀金庭。一得永得，自然身轻。</font>
</p>
<p align="center">
<font face="宋体" color="#000000" size="3">太和充盈，骨散寒琼。得丹则灵，不得则倾。丹在身中，非白非青。</font>
</p>
<p align="center">
<font face="宋体" color="#000000" size="3">诵持万遍，妙理自明。</font>
</p>
