　　楞严咒曰，尔时世尊从肉中涌百宝光，光中涌出千叶宝莲，有化如来坐宝花中，顶放十道百宝光明，皆偏示，大众仰观放光如来宣说神咒者，即阳神之出也。故曰，佛子。苟不得慧命之道，枯寂口禅，焉有自身，焉得谓世尊为小道乎，此即泄楞严之秘密，谕后学。得此道者，立超圣域，不落凡尘矣。</span></span></p>
