<p align="center"><b><font color="#FF3366" size="4">仙 佛 合 宗 语 录</font></b> </p>
<p align="center"><font face="宋体" color="#000000" size="3"><b><font color="#FF33FF">自 
  序</font></b></font> </p>
<p>
<font face="宋体" color="#000000" size="3"><b>　　冲虚子自序曰：仙宗果位，了证长生。佛宗果位，了证无生。然而了证无生尤以了证长生为实诣，了证长生尤以了证无生为始终，所谓性命双修者也。今我述斯宗，厥意在仙宗，其佛宗不过带言而已。名曰合宗者，欲使天下后世同志，圣真知性命双修为要也。向作《天仙正理直论》九章敷陈仙理，次第详明。兹复述《仙佛合字语录》九章，一以阐明《直论》未泄之秘法，一以罄口传未悉之天机。有是录，而玄中之玄，妙中之妙炳若日星矣。得斯录者，精进修持，成仙，成佛，庶不负我度人之苦心也欤！</b></font>
</p>
