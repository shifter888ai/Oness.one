<p align="center" class="auto-style2"><font color="#FF00FF">任 督 二 脉 图 第 三</font></p>
<p align="center">
<img src="h03rdemt.jpg"  width="600" height="964" class="auto-style1"></p>
<p class="auto-style1">　　盖此图于前二图是一也，所以重绘者何为？是恐修道之人不知自身法轮之道路，故备此图，以晓同志耳。盖人能通此二脉，则百脉俱通矣。所以鹿之睡时，鼻入肛门，通其督脉，鹤龟通其任脉，三物俱有千年之寿，何况人乎！修道之士，既转法轮，以通慧命，何患不长寿，而成其道业。 
  　</p>
