<p align="center"><font face="宋体" color="#000000" size="3"><b><font color="#FF33FF">末 
  后 还 虚 第 九</font></b></font> </p>
<p> <font face="宋体" color="#000000" size="3"><b>　　曰云：“《直论》中有‘上关炼神，九年面壁’之名，末后还虚，未审炼神义旨。求师详示。”</b></font> 
  <br>
  <font face="宋体" color="#000000" size="3"><b>　　曰：“炼神也者，无神可凝之谓也。缘守中乳哺时，尚有寂照之神。此后神不自神，复归无极，体证虚空。虽历亿劫，只以完其恒性，岂特九年而已哉？九年云者，不过欲使初证神仙者，知还虚实证天仙之先务也，故于九年之中，不见有大道之可修也，亦不见有仙佛之可证也。于焉心与俱化，法与俱忘，寂之无所寂也，照之无所照也，又何神之可云乎？故强名以立法，为末后还虚云耳。佛宗云：‘欲证虚空体，示等虚空法。证得虚空时，无是无非法。’合此宗也。”</b></font> 
</p>
