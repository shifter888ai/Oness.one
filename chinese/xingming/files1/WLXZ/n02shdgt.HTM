  玉 蟾 水 调 歌 头</font></b></font> </p>
<p> <font face="宋体" color="#000000" size="3">　　未遇明师指，日夜苦忧惊。及乎遇了，得些口诀又忘情。可惜蹉跎过了。不念精衰气竭，碌碌度平生．何不回头看，下手采来烹。</font> 
</p>
<p> <font face="宋体" color="#000000" size="3">　　天下人，知得者，不能行，可怜埋没，如何凭地不惺惺。只见口头说着，方寸都无些子，只管看丹经。地狱门开了、急急辨前程。</font> 
</p>
