　　且此图楞严经原本有之妙旨，俗僧不知道胎者，因当初未续图之过耳。今以阐扬，修士方知如来有道胎真实之功夫在矣。盖胎者，非有形有，而别物可以成之，实则我之神气也。先以神入乎其气，后气来包乎其神，神气，结，而意则寂然不动所谓胎矣。且气凝而后神灵，故经曰，亲奉觉应，二气培养。故曰，日益增长，气足胎圆，从顶而出，所谓形成出胎，亲为佛子者矣。</span></span></p>
