<p><b>转识成就法</b></p>
<p>其最上者于初期中阴，认知净光，成就法身；中等者于中期中阴，证入智悲合体，成就根身；求生者重人轮迥，转生成佛。</p>
<p>其修法：</p>
<p>
“先作宝瓶气，风息三七遍；用意捉识神，经中脉上行，于三七灵轮，一一轮提升；上升复下降，相应诵真言；此所诵真言，有全半两声，诵真言之声，呼出高且响；导能知识神，趣入净乐界，临终时一至，转识顿成就”。此法有常修和临终时用两法。</p>
