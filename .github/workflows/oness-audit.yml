name: Oness.one read-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
      - name: Run read-only repository audit
        run: python3 .github/scripts/oness_audit.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: oness-one-audit-results
          path: AUDIT-RESULTS.md
          if-no-files-found: error
          retention-days: 14
