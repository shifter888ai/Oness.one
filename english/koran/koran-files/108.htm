<h1><a href="http://islamicity.com"><img border="0" src="../arabicscript/islogo2.gif" width="83" height="24"><br>
</a>Surah 108. Abundance, Plenty</h1>
<p>
<A NAME="1"><b>1.</b></A> To thee have We granted the Fount (of Abundance).
<p>
<A NAME="2"><b>2.</b></A> Therefore to thy Lord turn in Prayer and Sacrifice.
<p>
<A NAME="3"><b>3.</b></A> For he who hateth thee, he will be cut off (from Future Hope).
<p>
