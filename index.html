<style>
:root { color-scheme: light; }
body { background: #ffffff; color: #666666; transition: background-color .2s ease, color .2s ease; }
body a { color: #0645ad; }
#theme-toggle {
  position: fixed; top: 12px; right: 12px; z-index: 9999;
  border: 1px solid #888; border-radius: 999px; padding: 8px 12px;
  background: #f2f2f2; color: #222; font: 14px Arial, Helvetica, sans-serif;
  cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.12);
}
body.dark-mode { background: #171717; color: #dddddd; }
body.dark-mode a { color: #9ecbff; }
body.dark-mode #theme-toggle { background: #303030; color: #f2f2f2; border-color: #777; }
body.dark-mode hr { border-color: #555; }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
<script>
(function () {
  function applyTheme(theme) {
    document.body.classList.toggle('dark-mode', theme === 'dark');
    document.documentElement.style.colorScheme = theme;
    var button = document.getElementById('theme-toggle');
    if (button) {
      button.textContent = theme === 'dark' ? '☀ Light mode' : '☾ Dark mode';
      button.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    }
  }
  document.addEventListener('DOMContentLoaded', function () {
    var saved = null;
    try { saved = localStorage.getItem('oness-theme'); } catch (e) {}
    applyTheme(saved === 'dark' ? 'dark' : 'light');
    var button = document.getElementById('theme-toggle');
    button.addEventListener('click', function () {
      var next = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
      try { localStorage.setItem('oness-theme', next); } catch (e) {}
      applyTheme(next);
    });
  });
})();
</script>
